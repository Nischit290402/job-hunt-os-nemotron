name: ci
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SIGNING_SECRET: ci-only-signing-secret-0123456789

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: agent
      - run: npx playwright install --with-deps chromium
        working-directory: agent
      - run: npm test
        working-directory: agent

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check worker/cli.mjs
      - name: Answers that break the schema are refused before sending
        run: |
          mkdir -p .work
          echo '{"id":1,"kind":"judge","instructions":"i","input":"x","schema":{"type":"object","required":["score"],"properties":{"score":{"type":"integer","maximum":100}}},"meta":{}}' > .work/1.json
          echo '{"score": 140}' > bad.json
          if JOBHUNT_URL=http://127.0.0.1:9 WORKER_TOKEN=t node worker/cli.mjs answer 1 bad.json; then echo "should have failed"; exit 1; fi

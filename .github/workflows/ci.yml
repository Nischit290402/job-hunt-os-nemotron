name: ci
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SIGNING_SECRET: ci-only-signing-secret-0123456789

  resume-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base poppler-utils
      - run: python3 -m unittest -v
        working-directory: resume-service

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: agent
      - run: npx playwright install --with-deps chromium
        working-directory: agent
      - run: npm test
        working-directory: agent

  resume-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image with stand-in assets
        working-directory: resume-service
        run: |
          mkdir -p assets/bases
          printf '%s\n' '\documentclass{article}' '\usepackage{fontawesome}' '\begin{document}x \faExternalLink\end{document}' > assets/bases/Base_MLEngineer.tex
          docker build -t resume-svc .
      - name: fontawesome is installed and a base compiles
        run: |
          docker run --rm resume-svc kpsewhich fontawesome.sty
          docker run --rm resume-svc sh -c 'cd /tmp && cp /app/assets/bases/Base_MLEngineer.tex t.tex && pdflatex -interaction=nonstopmode -halt-on-error t.tex >/dev/null && pdfinfo t.pdf | grep Pages'
